services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: manakmitra:sih26107
    container_name: manakmitra
    ports:
      - "8080:8080"
    env_file:
      - path: .env.local
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
      HYBRID_RAG: ${HYBRID_RAG:-0}
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
